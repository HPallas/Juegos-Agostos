        <h1>Contacto:</h1>
        <p>Escriba su duda y en un plazo de 48 dias naturales le responderemos(probablemente).</p>
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>
            <label for="email">Correo:</label>
            <input type="email" id="email" required>
            <label for="text">Cuerpo</label>
            <textarea id="mensaje" name="mensaje" required placeholder="Escriba aqui..."></textarea>

            <button type="submit">Enviar</button>
        </form>
